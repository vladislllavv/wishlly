query ListApprovedIdeas($interest: String!, $limit: Int = 20) @auth(
  level: USER
  insecureReason: "Approved community ideas are intentionally visible to every logged-in app user, not just their author — there is no owner to scope this to."
) {
  ideaInterests(
    where: {
      interest: { eq: $interest }
      idea: { status: { eq: "approved" }, mergedIntoId: { isNull: true } }
    }
    limit: $limit
  ) {
    idea {
      # id, never wishId: wishId round-trips to a Firestore wish any
      # signed-in user can read, which would de-anonymize the idea's author
      # in one more call (final review, Critical #2).
      id
      title
      imageUrl
      link
      priceAmount
      priceCurrency
      createdAt
      ideaAdds_on_idea {
        _count
      }
    }
  }
}
