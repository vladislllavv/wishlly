# Anonymized, moderated community idea — no owner field, ever.
# Keyed by a fresh UUID, NOT the Firestore wish id: the wish id is kept only
# as an internal `wishId` column for the mirror job to upsert/delete by, and
# is never selected in a client-facing query. Any signed-in user can read
# any wish by id (firestore.rules only requires signedIn()), so exposing
# wishId directly would let a client resolve an idea's author in one extra
# call — a straight violation of "no path lets a client read who owns the
# original wish" (final review, 2026-10-01, Critical #2).
type IdeaItem @table {
  wishId: String! @unique
  title: String!
  imageUrl: String!
  link: String!
  priceAmount: Float
  priceCurrency: String
  status: String! @default(value: "pending") # pending | approved | rejected
  mergedInto: IdeaItem
  createdAt: Timestamp! @default(expr: "request.time")
}

# Which of the fixed 100 interest-catalog strings an idea matches.
type IdeaInterest @table(key: ["idea", "interest"]) {
  idea: IdeaItem!
  interest: String!
}

# One row per user who added an idea to their own wishlist — the primary
# key enforces "one vote per user" at the database level.
type IdeaAdd @table(key: ["idea", "userId"]) {
  idea: IdeaItem!
  userId: String!
  addedAt: Timestamp! @default(expr: "request.time")
}

# Keyed by (idea, reporter) so one user can't flood reports on the same idea
# (final review, Minor #4) — a repeat report just refreshes reason/createdAt.
type IdeaReport @table(key: ["idea", "reporterId"]) {
  idea: IdeaItem!
  reporterId: String!
  reason: String!
  createdAt: Timestamp! @default(expr: "request.time")
}
